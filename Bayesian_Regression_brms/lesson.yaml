  Output: "Let's look at the data. Type screentime |> head() to see the first few rows."
  CorrectAnswer: screentime |> head()
  AnswerTests: omnitest(correctExpr='screentime |> head()')
  Hint: Try screentime |> head()

#10
- Class: cmd_question
  Output: "Let's visualize the relationship between screen time and wellbeing with a scatterplot and linear trend."
  CorrectAnswer: screentime |> ggplot(aes(x = hours, y = wellbeing)) + geom_point() + geom_smooth(method = "lm") + xlab("Daily Screen Time (hours)") + ylab("Wellbeing (WHO-5)")
  AnswerTests: omnitest(correctExpr='screentime |> ggplot(aes(x = hours, y = wellbeing)) + geom_point() + geom_smooth(method = "lm") + xlab("Daily Screen Time (hours)") + ylab("Wellbeing (WHO-5)")')
  Hint: Try screentime |> ggplot(aes(x = hours, y = wellbeing)) + geom_point() + geom_smooth(method = "lm") + xlab("Daily Screen Time (hours)") + ylab("Wellbeing (WHO-5)")

#11
- Class: text
  Output: "There appears to be a negative relationship between screen time and wellbeing. Let's first fit the frequentist version for comparison, and then fit the same model using brms."

#12
- Class: cmd_question
  Output: "Fit a frequentist linear model predicting wellbeing from screen time hours and view the summary."
  CorrectAnswer: lm(wellbeing ~ hours, data = screentime) |> summary()
  AnswerTests: omnitest(correctExpr='lm(wellbeing ~ hours, data = screentime) |> summary()')
  Hint: Try lm(wellbeing ~ hours, data = screentime) |> summary()

#13
- Class: text
  Output: "Now let's fit the Bayesian version with brms. The syntax mirrors lm() almost exactly -- you specify the formula and data the same way. brms translates your model into Stan code, compiles it, and runs HMC sampling to approximate the posterior distribution."

#14
- Class: cmd_question
  Output: "Fit a Bayesian linear model predicting wellbeing from hours using brm(). We add seed = 42 for reproducibility and silent = 2, refresh = 0 to suppress verbose output. This may take a moment to compile."
  CorrectAnswer: fit1 <- brm(wellbeing ~ hours, data = screentime, seed = 42, silent = 2, refresh = 0)
  AnswerTests: omnitest(correctExpr='fit1 <- brm(wellbeing ~ hours, data = screentime, seed = 42, silent = 2, refresh = 0)')
  Hint: Try fit1 <- brm(wellbeing ~ hours, data = screentime, seed = 42, silent = 2, refresh = 0)

#15
- Class: cmd_question
  Output: "Now let's look at the model summary."
  CorrectAnswer: summary(fit1)
  AnswerTests: omnitest(correctExpr='summary(fit1)')
  Hint: Try summary(fit1)

#16
- Class: text
  Output: "Let's break down the brms output. The 'Estimate' column gives the posterior mean for each parameter -- similar to the frequentist coefficient. 'Est.Error' is the posterior standard deviation. 'l-95% CI' and 'u-95% CI' form the 95% credible interval -- there is a 95% probability the true parameter lies in this range (unlike a frequentist confidence interval!). 'Rhat' should be approximately 1.00, indicating the MCMC chains have converged. 'Bulk_ESS' and 'Tail_ESS' report the effective sample size -- these should be at least 400 for reliable estimates."

#17
- Class: mult_question
  Output: "What does Rhat approximately equal to 1.00 indicate in brms output?"
  AnswerChoices: The MCMC chains have converged;The model is statistically significant;The prior is correct;The residuals are normal
  CorrectAnswer: The MCMC chains have converged
  AnswerTests: omnitest(correctVal='The MCMC chains have converged')
  Hint: Rhat is a convergence diagnostic that compares between-chain and within-chain variance.

#18
- Class: cmd_question
  Output: "Let's visualize the posterior distributions and trace plots for our model parameters."
  CorrectAnswer: plot(fit1)
  AnswerTests: omnitest(correctExpr='plot(fit1)')
  Hint: Try plot(fit1)

#19
- Class: text
  Output: "The left panels show the posterior density for each parameter. The right panels show the trace plots -- the path each MCMC chain took through parameter space. Good trace plots look like 'hairy caterpillars' -- the chains should overlap and mix well, with no trends, drifts, or stuck regions. If the chains look like distinct ribbons or show long-term trends, that signals a convergence problem."

