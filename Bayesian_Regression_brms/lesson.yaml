#22
- Class: text
  Output: "brms uses default weakly informative priors so your model works out of the box. But you can and often should set your own priors based on domain knowledge. The function get_prior() shows you what priors brms will use for a given model formula, and set_prior() lets you customize them."

#23
- Class: cmd_question
  Output: "Let's see what default priors brms would use for our model with hours and age."
  CorrectAnswer: get_prior(wellbeing ~ hours + age, data = screentime)
  AnswerTests: omnitest(correctExpr='get_prior(wellbeing ~ hours + age, data = screentime)')
  Hint: Try get_prior(wellbeing ~ hours + age, data = screentime)

#24
- Class: mult_question
  Output: "In brms, what does Bulk_ESS represent?"
  AnswerChoices: The effective number of independent posterior samples;The total number of iterations;The sample size of the data;The number of predictors
  CorrectAnswer: The effective number of independent posterior samples
  AnswerTests: omnitest(correctVal='The effective number of independent posterior samples')
  Hint: ESS stands for Effective Sample Size and accounts for autocorrelation in the MCMC chains.
