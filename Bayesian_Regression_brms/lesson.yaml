#2
- Class: text
  Output: "So far, we've used conjugate models and the BayesFactor package to do Bayesian inference. But real research often needs more flexible models -- multiple predictors, random effects, non-normal outcomes. That's where brms comes in."

#3
- Class: text
  Output: "brms (Bayesian Regression Models using Stan) lets you fit virtually any regression model in a Bayesian framework. It uses familiar R formula syntax (just like lm() or glm()) but estimates the posterior distribution instead of point estimates."

#4
- Class: text
  Output: "Why do we need special software? For simple models like the Beta-Binomial, we could compute the posterior analytically using conjugate updating. For most real regression models with multiple parameters, there is no closed-form solution. We need numerical methods to approximate the posterior."

#5
- Class: text
  Output: "This is where Markov Chain Monte Carlo (MCMC) comes in. Imagine exploring a mountain range in dense fog. You cannot see the whole landscape, but you can feel the slope under your feet. MCMC algorithms take a series of steps through the parameter space, spending more time in regions of high posterior probability. Over many steps, the collection of visited points approximates the posterior distribution."

#6
- Class: text
  Output: "Hamiltonian Monte Carlo (HMC) is the specific MCMC algorithm used by Stan (and therefore brms). Unlike basic Metropolis-Hastings, which proposes random steps, HMC uses the gradient (slope) of the posterior -- like rolling a ball on the surface of the posterior landscape. This lets it make large, efficient moves through parameter space while maintaining a high acceptance rate, especially in high-dimensional models."

#7
- Class: mult_question
  Output: "Why is HMC preferred over basic Metropolis-Hastings for complex models?"
  AnswerChoices: It uses gradient information to explore the posterior more efficiently;It does not require priors;It is faster to compile;It guarantees finding the global maximum
  CorrectAnswer: It uses gradient information to explore the posterior more efficiently
  AnswerTests: omnitest(correctVal='It uses gradient information to explore the posterior more efficiently')
  Hint: Think about what makes HMC special compared to random-walk proposals.

#8
- Class: text
  Output: "Digital health researchers examined the relationship between daily smartphone screen time and mental wellbeing. 150 participants reported their average daily screen time in hours and completed the WHO-5 wellbeing questionnaire (scored 0-100). The researchers also recorded each participant's age as a potential covariate."

