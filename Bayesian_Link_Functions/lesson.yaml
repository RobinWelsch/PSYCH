#2
- Class: text
  Output: "So far our brms models have assumed a normal (Gaussian) outcome. But HCI data is often non-normal: binary outcomes (did the user complete the task?), counts (how many times did they open the app?), and ordinal scales (Likert ratings). Link functions let us model these outcomes appropriately."

#3
- Class: text
  Output: "App developers tested whether gamification features improve engagement with a fitness app. 180 participants used either a gamified or standard version for 2 weeks. Three outcomes were measured: whether they were still using the app after 2 weeks (retained), average daily app opens, and satisfaction rating (1-5 Likert scale)."

#4
- Class: cmd_question
  Output: Let's look at the data. Type engagement |> head() to see the first few rows.
  CorrectAnswer: engagement |> head()
  AnswerTests: omnitest(correctExpr='engagement |> head()')
  Hint: Try engagement |> head()

#5
- Class: cmd_question
  Output: "Let's get descriptive statistics by condition. Pipe engagement into group_by(condition), then summarise() with retention = mean(retained), avg_opens = mean(daily_opens), and avg_satisfaction = mean(satisfaction)."
  CorrectAnswer: engagement |> group_by(condition) |> summarise(retention = mean(retained), avg_opens = mean(daily_opens), avg_satisfaction = mean(satisfaction))
  AnswerTests: omnitest(correctExpr='engagement |> group_by(condition) |> summarise(retention = mean(retained), avg_opens = mean(daily_opens), avg_satisfaction = mean(satisfaction))')
  Hint: Try engagement |> group_by(condition) |> summarise(retention = mean(retained), avg_opens = mean(daily_opens), avg_satisfaction = mean(satisfaction))

#6
- Class: text
  Output: "Part 1: Logistic Regression for Binary Outcomes. When the outcome is binary (0 or 1), we use logistic regression. The link function is the logit -- it transforms a probability (bounded between 0 and 1) to the log-odds scale (unbounded), allowing a linear model on the transformed scale."

#7
- Class: text
  Output: "Recall from the Regression module: in frequentist glm(), we use family = binomial. In brms, we use family = bernoulli() for binary outcomes. The bernoulli family automatically applies the logit link function."

#8
- Class: cmd_question
  Output: "Let's fit a Bayesian logistic regression predicting retention from condition. Type fit_logistic <- brm(retained ~ condition, data = engagement, family = bernoulli(), seed = 42, silent = 2, refresh = 0)"
  CorrectAnswer: fit_logistic <- brm(retained ~ condition, data = engagement, family = bernoulli(), seed = 42, silent = 2, refresh = 0)
  AnswerTests: omnitest(correctExpr='fit_logistic <- brm(retained ~ condition, data = engagement, family = bernoulli(), seed = 42, silent = 2, refresh = 0)')
  Hint: Try fit_logistic <- brm(retained ~ condition, data = engagement, family = bernoulli(), seed = 42, silent = 2, refresh = 0)

#9
- Class: cmd_question
  Output: "Let's see the model summary. The coefficients are on the log-odds scale. Type summary(fit_logistic)"
  CorrectAnswer: summary(fit_logistic)
  AnswerTests: omnitest(correctExpr='summary(fit_logistic)')
  Hint: Try summary(fit_logistic)

