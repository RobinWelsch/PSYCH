  CorrectAnswer: fit_poisson <- add_criterion(fit_poisson, "loo"); fit_negbin <- add_criterion(fit_negbin, "loo"); loo_compare(fit_poisson, fit_negbin)
  AnswerTests: omnitest(correctExpr='fit_poisson <- add_criterion(fit_poisson, "loo"); fit_negbin <- add_criterion(fit_negbin, "loo"); loo_compare(fit_poisson, fit_negbin)')
