#16
- Class: mult_question
  Output: "For Poisson regression, exponentiating the coefficient gives..."
  AnswerChoices: The rate ratio -- multiplicative change in expected count;The odds ratio;The probability;The raw count difference
  CorrectAnswer: The rate ratio -- multiplicative change in expected count
  AnswerTests: omnitest(correctVal='The rate ratio -- multiplicative change in expected count')
  Hint: The log link means coefficients are on the log scale. Exponentiating gives a multiplicative (ratio) effect.

#17
- Class: text
  Output: "A key assumption of Poisson regression is that the mean equals the variance (equidispersion). In practice, count data often has variance greater than the mean -- this is called overdispersion. When overdispersion is present, the negative binomial family is preferred because it adds a dispersion parameter."

#18
- Class: cmd_question
  Output: "Let's fit a negative binomial model for comparison. Type fit_negbin <- brm(daily_opens ~ condition, data = engagement, family = negbinomial(), seed = 42, silent = 2, refresh = 0)"
  CorrectAnswer: fit_negbin <- brm(daily_opens ~ condition, data = engagement, family = negbinomial(), seed = 42, silent = 2, refresh = 0)
  AnswerTests: omnitest(correctExpr='fit_negbin <- brm(daily_opens ~ condition, data = engagement, family = negbinomial(), seed = 42, silent = 2, refresh = 0)')
  Hint: Try fit_negbin <- brm(daily_opens ~ condition, data = engagement, family = negbinomial(), seed = 42, silent = 2, refresh = 0)

#19
