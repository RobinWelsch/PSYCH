#24
- Class: mult_question
  Output: "Which family would you use in brms for a Likert scale outcome (1-7)?"
  AnswerChoices: cumulative() for ordinal regression;gaussian() for normal regression;bernoulli() for logistic regression;poisson() for count regression
  CorrectAnswer: cumulative() for ordinal regression
  AnswerTests: omnitest(correctVal='cumulative() for ordinal regression')
  Hint: Likert scales are ordered categories, which calls for ordinal regression.

#25
- Class: mult_question
  Output: "Why might negative binomial be preferred over Poisson for count data?"
  AnswerChoices: It can handle overdispersion where variance exceeds the mean;It is always more accurate;It does not require a link function;It works with binary data too
  CorrectAnswer: It can handle overdispersion where variance exceeds the mean
  AnswerTests: omnitest(correctVal='It can handle overdispersion where variance exceeds the mean')
  Hint: Think about the key assumption of Poisson regression (mean = variance) and what happens when it is violated.
