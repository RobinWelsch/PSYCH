#11
- Class: mult_question
  Output: "In logistic regression, the link function transforms..."
  AnswerChoices: The probability to the log-odds scale;The outcome to be normal;The predictor to be binary;The prior to the posterior
  CorrectAnswer: The probability to the log-odds scale
  AnswerTests: omnitest(correctVal='The probability to the log-odds scale')
  Hint: The logit link maps probabilities (0 to 1) to the entire real number line via log-odds.

#12
- Class: text
  Output: "Part 2: Poisson Regression for Count Outcomes. When the outcome is a count (non-negative integers), we use Poisson regression. The link function is the log -- it transforms the expected count (which must be positive) to the log scale (unbounded), allowing a linear model."

#13
- Class: cmd_question
  Output: "Let's fit a Bayesian Poisson regression predicting daily app opens from condition. Type fit_poisson <- brm(daily_opens ~ condition, data = engagement, family = poisson(), seed = 42, silent = 2, refresh = 0)"
  CorrectAnswer: fit_poisson <- brm(daily_opens ~ condition, data = engagement, family = poisson(), seed = 42, silent = 2, refresh = 0)
  AnswerTests: omnitest(correctExpr='fit_poisson <- brm(daily_opens ~ condition, data = engagement, family = poisson(), seed = 42, silent = 2, refresh = 0)')
  Hint: Try fit_poisson <- brm(daily_opens ~ condition, data = engagement, family = poisson(), seed = 42, silent = 2, refresh = 0)

