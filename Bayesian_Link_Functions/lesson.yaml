#20
- Class: text
  Output: "Part 3: Ordinal Regression for Ordered Categories. Likert scale ratings (e.g., 1-5) are ordered but not necessarily equally spaced. Ordinal regression with the cumulative logit link models the probability of being at or below each category. In brms, we use family = cumulative(\"logit\")."

