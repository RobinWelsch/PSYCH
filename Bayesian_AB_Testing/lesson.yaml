#9
- Class: text
  Output: "Now let's think Bayesian. For binary outcomes like task completion (success or failure), we use the Beta distribution as our prior for the success probability. The Beta distribution is defined on [0, 1], making it perfect for modelling probabilities."

- Class: text
  Output: "Beta(1, 1) is a uniform prior -- it says every success probability between 0 and 1 is equally likely. This represents having no prior knowledge. More generally, Beta(alpha, beta) can be thought of as having observed (alpha - 1) prior successes and (beta - 1) prior failures. The Beta distribution is called the 'conjugate prior' for binomial data because the posterior is also a Beta distribution."

#11
- Class: cmd_question
  Output: Let's visualize the uniform prior Beta(1,1). Type the following to plot the density curve.
  CorrectAnswer: curve(dbeta(x, 1, 1), from=0, to=1, ylab="Density", xlab="Success Probability", main="Uniform Prior: Beta(1,1)")
  AnswerTests: omnitest(correctExpr='curve(dbeta(x, 1, 1), from=0, to=1, ylab="Density", xlab="Success Probability", main="Uniform Prior: Beta(1,1)")')
  Hint: Try curve(dbeta(x, 1, 1), from=0, to=1, ylab="Density", xlab="Success Probability", main="Uniform Prior: Beta(1,1)")

- Class: text
  Output: "After observing data, the posterior is Beta(alpha + successes, beta + failures). This elegant update rule is called the conjugate update. Starting from our prior Beta(1,1) and adding what we observe, we get a posterior that reflects both our prior beliefs and the data."

