- Class: text
  Output: "You've spent the course learning frequentist statistics. Now we introduce an alternative framework -- Bayesian statistics."

- Class: text
  Output: "The core idea is this -- instead of asking 'what is the probability of this data given the null hypothesis?' (the frequentist p-value), we ask 'what is the probability of my hypothesis given the data?' This is a fundamentally different question, and many researchers find it more intuitive."

#4
- Class: text
  Output: "Bayes' theorem gives us the math: P(theta | data) is proportional to P(data | theta) times P(theta). In plain language: Posterior = Likelihood x Prior. The posterior is our updated belief about a parameter after seeing the data. The likelihood is how well the data fits a given parameter value. The prior is what we believed before seeing the data."

- Class: mult_question
  Output: "In Bayesian statistics, what does the 'prior' represent?"
  AnswerChoices: Our belief before seeing data;The p-value;The sample mean;The confidence interval
  CorrectAnswer: Our belief before seeing data
  AnswerTests: omnitest(correctVal='Our belief before seeing data')
  Hint: Think about what information we have before collecting data.

