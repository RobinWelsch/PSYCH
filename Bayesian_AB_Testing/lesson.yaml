- Class: cmd_question
  Output: "Now let's overlay both posteriors on one plot. We'll plot Design B in red first, then add Design A in blue."
  CorrectAnswer: curve(dbeta(x, 1 + b_success, 1 + b_fail), from=0, to=1, col="red", ylab="Density", xlab="Success Probability", main="Posteriors for Both Designs"); curve(dbeta(x, 1 + a_success, 1 + a_fail), add=TRUE, col="blue")
  AnswerTests: omnitest(correctExpr='curve(dbeta(x, 1 + b_success, 1 + b_fail), from=0, to=1, col="red", ylab="Density", xlab="Success Probability", main="Posteriors for Both Designs"); curve(dbeta(x, 1 + a_success, 1 + a_fail), add=TRUE, col="blue")')
  Hint: "Try curve(dbeta(x, 1 + b_success, 1 + b_fail), from=0, to=1, col=\"red\", ylab=\"Density\", xlab=\"Success Probability\", main=\"Posteriors for Both Designs\"); curve(dbeta(x, 1 + a_success, 1 + a_fail), add=TRUE, col=\"blue\")"

- Class: text
  Output: "The plot shows two posterior distributions. Blue is Design A, and red is Design B. Notice how the curves are separated -- this suggests the two designs have different success probabilities. But how confident are we? We can directly compute the probability that Design B is better than Design A by simulating from both posteriors."

#20
- Class: cmd_question
  Output: "Let's simulate 10000 draws from each posterior and compute the probability that B is better than A."
  CorrectAnswer: set.seed(42); samples_a <- rbeta(10000, 1 + a_success, 1 + a_fail); samples_b <- rbeta(10000, 1 + b_success, 1 + b_fail); mean(samples_b > samples_a)
  AnswerTests: omnitest(correctExpr='set.seed(42); samples_a <- rbeta(10000, 1 + a_success, 1 + a_fail); samples_b <- rbeta(10000, 1 + b_success, 1 + b_fail); mean(samples_b > samples_a)')
  Hint: "Try set.seed(42); samples_a <- rbeta(10000, 1 + a_success, 1 + a_fail); samples_b <- rbeta(10000, 1 + b_success, 1 + b_fail); mean(samples_b > samples_a)"

- Class: mult_question
  Output: "If P(B > A) = 0.95, what does this mean?"
  AnswerChoices: There is a 95% probability that Design B is truly better than Design A;We reject H0 at alpha = 0.05;The effect size is 0.95;Design B's success rate is 95%
  CorrectAnswer: There is a 95% probability that Design B is truly better than Design A
  AnswerTests: omnitest(correctVal='There is a 95% probability that Design B is truly better than Design A')
  Hint: Think about what a direct probability statement means in Bayesian statistics.

#22
- Class: text
  Output: "Compare this to the frequentist approach: a p-value does NOT tell you the probability that your hypothesis is true. It tells you the probability of observing data this extreme if the null hypothesis were true. The Bayesian approach gives us a direct probability statement -- 'there is a 95% chance B is better than A' -- which is often what researchers actually want to know. There is no arbitrary significance threshold; instead, we get a full probability."

- Class: mult_question
  Output: "What is the conjugate prior for a binomial likelihood?"
  AnswerChoices: Beta;Normal;Gamma;Poisson
  CorrectAnswer: Beta
  AnswerTests: omnitest(correctVal='Beta')
  Hint: Which distribution is defined on [0, 1] and updates neatly with binomial data?

- Class: mult_question
  Output: "If our prior is Beta(1,1) and we observe 7 successes and 3 failures, what is our posterior?"
  AnswerChoices: Beta(8,4);Beta(7,3);Beta(1,1);Beta(8,3)
  CorrectAnswer: Beta(8,4)
  AnswerTests: omnitest(correctVal='Beta(8,4)')
  Hint: "Remember the update rule: Beta(alpha + successes, beta + failures). With Beta(1,1) as prior, alpha=1 and beta=1."
